<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escalação no Campinho</title>
<style>
:root{--bg:#eef2ec;--card:#fff;--ink:#14231a;--muted:#5d6e62;--line:#d3dccf;--grass:#1f7a3d;--grass-d:#0f2a1a;--gold:#f2c230}
@media (prefers-color-scheme:dark){:root{--bg:#0e1611;--card:#16211a;--ink:#eaf1e8;--muted:#9bb0a0;--line:#2a3a2f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,Arial,sans-serif}
header{background:var(--grass-d);color:#f4f7f2;padding:16px 20px;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:20px;letter-spacing:.2px}
header p{margin:2px 0 0;color:#a9c4b0;font-size:13px}
main{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px;padding:20px;max-width:1200px;margin:0 auto}
@media (max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{margin:0 0 10px;font-size:16px}
.panel h3{margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
input,select,button{font:inherit}
input[type=text],input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.row{display:grid;grid-template-columns:64px 1fr;gap:8px;margin-bottom:6px}
.row.b{grid-template-columns:64px 1fr 36px}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.colors input{width:100%;height:36px;padding:2px;border:1px solid var(--line);border-radius:6px;background:transparent}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.presets button{padding:5px 10px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer}
.presets button[aria-pressed=true]{background:var(--grass);color:#fff;border-color:var(--grass)}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--grass);color:#fff;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.x{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;cursor:pointer}
.cg{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.cg>span{width:62px;font-size:13px;color:var(--muted)}
.cg input[type=color]{width:44px;height:34px;padding:2px;border:1px solid var(--line);border-radius:6px;background:transparent;cursor:pointer}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.err{color:#c0392b;font-size:13px;min-height:18px;margin-top:4px}
.preview{position:sticky;top:12px;align-self:start}
canvas{width:100%;height:auto;border-radius:8px;display:block;background:#0f2a1a}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
</style>
</head>
<body>
<header><h1>Escalação no Campinho</h1><p>Monte o time, veja o campinho ao vivo e baixe em JPG.</p></header>
<main>
<section class="panel" aria-label="Dados da escalação">
  <h2>Time</h2>
  <label for="team">Nome do time</label>
  <input type="text" id="team" value="Meu Time">
  <label for="coach">Treinador</label>
  <input type="text" id="coach" placeholder="Nome do treinador">
  <label for="match">Jogo (opcional)</label>
  <input type="text" id="match" placeholder="Ex.: Final do Campeonato — 15/11">
  <label for="style">Modelo da camisa (exceto goleiro)</label>
  <select id="style" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)">
    <option value="solid">Lisa</option>
    <option value="vert">Listras verticais</option>
    <option value="horiz">Listras horizontais</option>
  </select>
  <label for="crest">Escudo do time (opcional)</label>
  <div style="display:flex;gap:8px;align-items:center">
    <input type="file" id="crest" accept="image/*" style="flex:1;min-width:0">
    <button type="button" class="btn alt" id="crestX" hidden>Remover</button>
  </div>
  <label>Cores (clique numa cor ou no quadrado para escolher outra)</label>
  <div class="cg"><span>Camisa</span><input type="color" id="cShirt" value="#d62828" aria-label="Cor da camisa"><div class="sw" data-for="cShirt"></div></div>
  <div class="cg"><span>Listras</span><input type="color" id="cShirt2" value="#ffffff" aria-label="Cor das listras"><div class="sw" data-for="cShirt2"></div></div>
  <div class="cg"><span>Goleiro</span><input type="color" id="cGk" value="#f2c230" aria-label="Cor do goleiro"><div class="sw" data-for="cGk"></div></div>
  <div class="cg"><span>Número</span><input type="color" id="cNum" value="#ffffff" aria-label="Cor do número"><div class="sw" data-for="cNum"></div></div>

  <h2 style="margin-top:18px">Formação</h2>
  <input type="text" id="form" value="4-3-3" aria-label="Formação, por exemplo 4-4-2">
  <div class="presets" id="presets"></div>
  <div class="err" id="err" role="alert"></div>

  <h2 style="margin-top:10px">Titulares</h2>
  <div id="players"></div>

  <h2 style="margin-top:18px">Reservas</h2>
  <div id="bench"></div>
  <button class="btn alt" id="addBench" type="button">Adicionar reserva</button>
</section>

<section class="preview" aria-label="Prévia">
  <canvas id="cv" width="1080" height="1600"></canvas>
  <div class="actions">
    <button class="btn" id="dl" type="button">Baixar JPG</button>
  </div>
</section>
</main>

<script>
(function(){
const $=id=>document.getElementById(id);
const PRESETS=["4-4-2","4-3-3","4-2-3-1","3-5-2","3-4-3","5-4-1","5-3-2","4-5-1","4-1-4-1"];
let lines=[4,3,3];
const players=Array.from({length:11},(_,i)=>({num:String(i+1),name:""}));
const bench=Array.from({length:7},(_,i)=>({num:String(12+i),name:""}));
const cv=$("cv"),ctx=cv.getContext("2d");
let crest=null;
$("crest").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{crest=img;$("crestX").hidden=false;draw();};
  img.onerror=()=>{alert("Não foi possível abrir essa imagem. Tente um arquivo PNG ou JPG.");};
  img.src=url;
});
$("crestX").onclick=()=>{crest=null;$("crest").value="";$("crestX").hidden=true;draw();};

function parseForm(s){
  const p=s.split(/[-\s,]+/).filter(Boolean).map(Number);
  if(!p.length||p.some(n=>!Number.isInteger(n)||n<1||n>6)) return null;
  if(p.reduce((a,b)=>a+b,0)!==10) return null;
  if(p.length>5) return null;
  return p;
}
function lineName(k,total){ // k = índice da linha de campo (0 = defesa)
  if(k===0) return "Defesa";
  if(k===total-1) return "Ataque";
  return total>3?"Meio-campo "+k:"Meio-campo";
}
function buildPresets(){
  const box=$("presets");box.innerHTML="";
  PRESETS.forEach(f=>{
    const b=document.createElement("button");b.type="button";b.textContent=f;
    b.setAttribute("aria-pressed",String(f===$("form").value.trim()));
    b.onclick=()=>{$("form").value=f;onForm();};
    box.appendChild(b);
  });
}
function buildPlayers(){
  const box=$("players");box.innerHTML="";
  let idx=0;
  const groups=[["Goleiro",1],...lines.map((n,k)=>[lineName(k,lines.length),n])];
  groups.forEach(([title,n])=>{
    const h=document.createElement("h3");h.textContent=title;box.appendChild(h);
    for(let j=0;j<n;j++){
      const i=idx++;
      const r=document.createElement("div");r.className="row";
      const a=document.createElement("input");a.type="text";a.inputMode="numeric";a.maxLength=2;a.value=players[i].num;a.placeholder="Nº";a.setAttribute("aria-label","Número do jogador "+(i+1));
      const b=document.createElement("input");b.type="text";b.value=players[i].name;b.placeholder="Nome do jogador";b.setAttribute("aria-label","Nome do jogador "+(i+1));
      a.oninput=()=>{players[i].num=a.value;draw();};
      b.oninput=()=>{players[i].name=b.value;draw();};
      r.append(a,b);box.appendChild(r);
    }
  });
}
function buildBench(){
  const box=$("bench");box.innerHTML="";
  bench.forEach((p,i)=>{
    const r=document.createElement("div");r.className="row b";
    const a=document.createElement("input");a.type="text";a.inputMode="numeric";a.maxLength=2;a.value=p.num;a.placeholder="Nº";a.setAttribute("aria-label","Número do reserva "+(i+1));
    const b=document.createElement("input");b.type="text";b.value=p.name;b.placeholder="Nome do reserva";b.setAttribute("aria-label","Nome do reserva "+(i+1));
    const x=document.createElement("button");x.type="button";x.className="x";x.textContent="×";x.setAttribute("aria-label","Remover reserva "+(i+1));
    a.oninput=()=>{p.num=a.value;draw();};
    b.oninput=()=>{p.name=b.value;draw();};
    x.onclick=()=>{bench.splice(i,1);buildBench();draw();};
    r.append(a,b,x);box.appendChild(r);
  });
}
function onForm(){
  const f=parseForm($("form").value);
  if(!f){$("err").textContent="Formação inválida: use até 5 linhas somando 10 jogadores de linha (ex.: 4-4-2).";buildPresets();return;}
  $("err").textContent="";lines=f;buildPlayers();buildPresets();draw();
}

/* ---------- desenho ---------- */
const F="'Segoe UI',Arial,sans-serif";
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function shirtPath(){
  ctx.beginPath();
  ctx.moveTo(-.25,-.5);ctx.quadraticCurveTo(0,-.33,.25,-.5);
  ctx.lineTo(.56,-.3);ctx.lineTo(.72,.02);ctx.lineTo(.46,.14);ctx.lineTo(.38,0);
  ctx.lineTo(.38,.5);ctx.lineTo(-.38,.5);ctx.lineTo(-.38,0);
  ctx.lineTo(-.46,.14);ctx.lineTo(-.72,.02);ctx.lineTo(-.56,-.3);ctx.closePath();
}
function shirt(x,y,s,fill,style,fill2){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  shirtPath();
  ctx.shadowColor="rgba(0,0,0,.45)";ctx.shadowBlur=16;ctx.shadowOffsetY=7;
  ctx.fillStyle=fill;ctx.fill();
  ctx.shadowColor="transparent";
  ctx.save();ctx.clip();
  if(style==="vert"||style==="horiz"){
    ctx.fillStyle=fill2||"#fff";
    const bw=.19;
    for(let i=1;i<9;i+=2){
      if(style==="vert") ctx.fillRect(-.85+i*bw,-.6,bw,1.2);
      else ctx.fillRect(-.85,-.6+i*bw,1.7,bw);
    }
  }
  const g=ctx.createLinearGradient(-.72,0,.72,0);
  g.addColorStop(0,"rgba(0,0,0,.22)");g.addColorStop(.35,"rgba(255,255,255,.10)");
  g.addColorStop(.7,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.26)");
  ctx.fillStyle=g;ctx.fillRect(-.8,-.6,1.6,1.2);
  ctx.restore();
  ctx.beginPath();ctx.moveTo(-.25,-.5);ctx.quadraticCurveTo(0,-.33,.25,-.5);
  ctx.lineWidth=.07;ctx.strokeStyle="rgba(0,0,0,.32)";ctx.stroke();
  shirtPath();ctx.lineWidth=.03;ctx.strokeStyle="rgba(0,0,0,.5)";ctx.lineJoin="round";ctx.stroke();
  ctx.restore();
}
function fit(text,maxW,size,weight){
  let s=size;
  do{ctx.font=weight+" "+s+"px "+F;s-=1;}while(ctx.measureText(text).width>maxW&&s>14);
}
function pill(cx,y,text,maxW){
  fit(text,maxW,28,"800");
  const w=Math.max(60,ctx.measureText(text).width+30),h=42;
  ctx.save();ctx.shadowColor="rgba(0,0,0,.4)";ctx.shadowBlur=10;ctx.shadowOffsetY=4;
  rr(cx-w/2,y-h/2,w,h,21);ctx.fillStyle="#ffffff";ctx.fill();ctx.restore();
  ctx.fillStyle="#10261a";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(text,cx,y+1);
}
function pitch(x,y,w,h){
  ctx.save();
  rr(x,y,w,h,26);ctx.shadowColor="rgba(0,0,0,.55)";ctx.shadowBlur=36;ctx.shadowOffsetY=14;
  ctx.fillStyle="#1d7a3c";ctx.fill();ctx.shadowColor="transparent";
  rr(x,y,w,h,26);ctx.clip();
  const n=14;
  for(let i=0;i<n;i++){ctx.fillStyle=i%2?"#1f8040":"#26924a";ctx.fillRect(x,y+i*h/n,w,h/n+1);}
  const vg=ctx.createRadialGradient(x+w/2,y+h/2,h*.25,x+w/2,y+h/2,h*.78);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.32)");
  ctx.fillStyle=vg;ctx.fillRect(x,y,w,h);
  const m=18,X=x+m,Y=y+m,W=w-2*m,H=h-2*m;
  ctx.strokeStyle="rgba(255,255,255,.82)";ctx.fillStyle="rgba(255,255,255,.82)";ctx.lineWidth=4;
  ctx.strokeRect(X,Y,W,H);
  ctx.beginPath();ctx.moveTo(X,Y+H/2);ctx.lineTo(X+W,Y+H/2);ctx.stroke();
  ctx.beginPath();ctx.arc(X+W/2,Y+H/2,90,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(X+W/2,Y+H/2,7,0,7);ctx.fill();
  const bw=W*.58,bh=H*.15,sw=W*.28,sh=H*.055,sd=H*.105;
  [1,0].forEach(top=>{
    const by=top?Y:Y+H-bh,sy=top?Y:Y+H-sh,spY=top?Y+sd:Y+H-sd;
    ctx.strokeRect(X+(W-bw)/2,by,bw,bh);
    ctx.strokeRect(X+(W-sw)/2,sy,sw,sh);
    ctx.beginPath();ctx.arc(X+W/2,spY,6,0,7);ctx.fill();
    ctx.beginPath();
    if(top)ctx.arc(X+W/2,spY,72,.305*Math.PI,.695*Math.PI);else ctx.arc(X+W/2,spY,72,1.305*Math.PI,1.695*Math.PI);
    ctx.stroke();
  });
  [[X,Y,0],[X+W,Y,.5],[X+W,Y+H,1],[X,Y+H,1.5]].forEach(([cx,cy,a])=>{
    ctx.beginPath();ctx.arc(cx,cy,24,a*Math.PI,(a+.5)*Math.PI);ctx.stroke();
  });
  ctx.restore();
}
function draw(){
  const W=1080,H=1600;
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#0b2214");bg.addColorStop(.5,"#123a22");bg.addColorStop(1,"#0a1d11");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.022)";
  for(let i=0;i<14;i++){
    const x0=i*170-320;
    ctx.beginPath();ctx.moveTo(x0,0);ctx.lineTo(x0+85,0);ctx.lineTo(x0+85-520,H);ctx.lineTo(x0-520,H);ctx.closePath();ctx.fill();
  }
  const gold=ctx.createLinearGradient(0,0,W,0);gold.addColorStop(0,"#f7d154");gold.addColorStop(1,"#e0a800");
  ctx.fillStyle=gold;ctx.fillRect(0,0,W,8);ctx.fillRect(0,H-8,W,8);

  // cabeçalho
  let tx=88,tw=680;
  ctx.textBaseline="alphabetic";ctx.textAlign="left";
  if(crest){
    ctx.beginPath();ctx.arc(118,104,62,0,7);ctx.fillStyle="rgba(255,255,255,.10)";ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle="#f2c230";ctx.stroke();
    const box=92,r=Math.min(box/crest.width,box/crest.height),cw=crest.width*r,ch=crest.height*r;
    ctx.drawImage(crest,118-cw/2,104-ch/2,cw,ch);
    tx=206;tw=560;
  }else{
    ctx.fillStyle=gold;ctx.fillRect(60,54,8,98);
  }
  const team=($("team").value||"Time").toUpperCase();
  ctx.fillStyle="#f4f7f2";fit(team,tw,58,"800");ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.fillText(team,tx,106);
  ctx.fillStyle="#f2c230";ctx.font="700 26px "+F;
  ctx.fillText(($("match").value||"Escalação").toUpperCase(),tx,148);
  // selo da formação
  rr(800,50,220,104,22);ctx.fillStyle=gold;ctx.fill();
  ctx.fillStyle="#10261a";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font="800 17px "+F;ctx.fillText("FORMAÇÃO",910,78);
  ctx.font="800 54px "+F;ctx.fillText(lines.join("-"),910,121);

  // campo
  const px=60,py=200,pw=960,ph=900;
  pitch(px,py,pw,ph);
  const cShirt=$("cShirt").value,cGk=$("cGk").value,cNum=$("cNum").value;
  const L=lines.length+1,top=py+112,bot=py+ph-135;
  let idx=0;
  for(let k=0;k<L;k++){
    const n=k===0?1:lines[k-1];
    const y=bot-(k/(L-1))*(bot-top);
    for(let j=0;j<n;j++){
      const x=px+pw*(j+1)/(n+1);
      const p=players[idx++];
      const isGk=k===0;
      const st=isGk?"solid":$("style").value;
      shirt(x,y,94,isGk?cGk:cShirt,st,$("cShirt2").value);
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.font="800 42px "+F;
      if(st!=="solid"){ctx.lineJoin="round";ctx.lineWidth=7;ctx.strokeStyle="rgba(0,0,0,.55)";ctx.strokeText(p.num,x,y+9);}
      ctx.fillStyle=isGk?contrast(cGk):cNum;
      ctx.fillText(p.num,x,y+9);
      if(p.name.trim()) pill(x,y+82,p.name.trim(),Math.min(200,pw/(n+0.4)-10));
    }
  }

  // reservas
  const list=bench.filter(b=>b.name.trim()||b.num.trim());
  const rows=Math.max(1,Math.ceil(list.length/2));
  const y0=py+ph+34,ph2=Math.max(150,Math.min(1490-y0,100+rows*54+20));
  rr(60,y0,960,ph2,22);ctx.fillStyle="rgba(255,255,255,.06)";ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle="rgba(255,255,255,.12)";ctx.stroke();
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.fillStyle="#f2c230";ctx.font="800 28px "+F;ctx.fillText("RESERVAS",96,y0+50);
  ctx.fillStyle="rgba(242,194,48,.45)";ctx.fillRect(96,y0+64,848,2);
  const avail=y0+ph2-(y0+84)-12;
  const rh=Math.min(52,avail/rows);
  list.forEach((b,i)=>{
    const col=i%2,row=Math.floor(i/2);
    const x=96+col*440,y=y0+84+row*rh+rh/2;
    const bst=$("style").value;
    const sz=Math.min(26,rh*.55);
    shirt(x+24,y,sz*1.15,cShirt,bst,$("cShirt2").value);
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.font="800 "+Math.round(sz*.62)+"px "+F;
    if(bst!=="solid"){ctx.lineJoin="round";ctx.lineWidth=4;ctx.strokeStyle="rgba(0,0,0,.55)";ctx.strokeText(b.num,x+24,y+2);}
    ctx.fillStyle=cNum;ctx.fillText(b.num,x+24,y+2);
    ctx.fillStyle="#f4f7f2";ctx.textAlign="left";
    fit(b.name||"—",360,28,"600");
    ctx.textBaseline="middle";ctx.fillText(b.name||"—",x+66,y+1);
  });

  // treinador
  const c=$("coach").value.trim();
  if(c){
    ctx.textAlign="left";ctx.textBaseline="alphabetic";
    ctx.fillStyle="#f2c230";ctx.font="800 18px "+F;ctx.fillText("TREINADOR",64,H-62);
    ctx.fillStyle="#f4f7f2";fit(c,880,36,"800");ctx.fillText(c,62,H-24);
  }
}
function contrast(hex){
  const v=parseInt(hex.slice(1),16),r=v>>16,g=(v>>8)&255,b=v&255;
  return (r*299+g*587+b*114)/1000>150?"#14231a":"#ffffff";
}

["team","coach","match","cShirt","cShirt2","style","cGk","cNum"].forEach(id=>$(id).addEventListener("input",draw));
$("form").addEventListener("input",onForm);
$("addBench").onclick=()=>{
  const last=bench.length?parseInt(bench[bench.length-1].num,10):11;
  bench.push({num:String(isNaN(last)?"":last+1),name:""});buildBench();draw();
};
$("dl").onclick=()=>{
  cv.toBlob(b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    const nm=($("team").value||"escalacao").trim().replace(/[^\w\-]+/g,"_");
    a.download="escalacao_"+nm+".jpg";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  },"image/jpeg",0.95);
};

const SW=["#d62828","#1d4ed8","#0b7a3b","#f2c230","#ffffff","#111111","#f97316","#7c3aed","#87ceeb","#800020"];
document.querySelectorAll(".sw").forEach(box=>{
  const inp=$(box.dataset.for);
  SW.forEach(c=>{
    const b=document.createElement("button");b.type="button";b.style.background=c;b.setAttribute("aria-label","Usar cor "+c);
    b.onclick=()=>{inp.value=c;inp.dispatchEvent(new Event("input"));};
    box.appendChild(b);
  });
});
buildPresets();buildPlayers();buildBench();draw();
})();
</script>
</body>
</html>
